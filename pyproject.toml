[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hako"
version = "0.1.0"
description = "Small local coding agent for DeepSeek, OpenAI-compatible, Anthropic-compatible, and Ollama models"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hako = "hako.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
  # Windows has no system tz database; zoneinfo (used by the benchmark
  # evaluator's timezone metadata) needs the tzdata package there.
  "tzdata; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
include = ["hako*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
